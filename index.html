<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoShop</title>
    <style>
      :root {
        --bg-dark: #0b1220;
        --panel: rgba(17, 24, 39, 0.8);
        --line: rgba(148, 163, 184, 0.25);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #f59e0b;
        --accent-strong: #ef4444;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(245, 158, 11, 0.18), transparent 25%),
          linear-gradient(135deg, var(--bg-dark), #111827 45%, #020617);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        width: min(90vw, 720px);
        padding: clamp(2rem, 5vw, 4rem);
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--panel);
        backdrop-filter: blur(14px);
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      .brand {
        display: inline-block;
        padding: 0.55rem 0.9rem;
        border: 1px solid rgba(245, 158, 11, 0.5);
        border-radius: 999px;
        letter-spacing: 0.22rem;
        text-transform: uppercase;
        font-size: 0.72rem;
        color: var(--accent);
        background: rgba(245, 158, 11, 0.06);
      }

      h1 {
        margin: 1.5rem 0 0.85rem;
        font-size: clamp(2.4rem, 7vw, 5rem);
        line-height: 1.05;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
      }

      .underline {
        width: 120px;
        height: 4px;
        margin: 1.75rem auto 0;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent), var(--accent-strong));
      }
    </style>
  </head>
  <body>
    <main class="card" aria-labelledby="coming-soon-title">
      <div class="brand">AutoShop</div>
      <h1 id="coming-soon-title">Coming soon</h1>
      <p>We are preparing an exceptional automotive marketplace for your next purchase.</p>
      <div class="underline" aria-hidden="true"></div>
    </main>
  </body>
</html>
